name: Build FaceID2D Tweak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang git perl wget unar

    - name: Setup Roothide Theos
      run: |
        git clone --recursive https://github.com/roothide/theos.git /opt/theos

    - name: Setup iOS SDK
      run: |
        rm -rf /opt/theos/sdks
        git clone --depth 1 https://github.com/theos/sdks.git /opt/theos/sdks

    - name: Setup Linux Toolchain
      run: |
        mkdir -p /opt/theos/toolchain/linux/iphone
        curl -LO https://github.com/orion-tweak/toolchain/releases/download/v1.0.0/linux-arm64e-clang.tar.xz
        tar -xf linux-arm64e-clang.tar.xz -C /opt/theos/toolchain/linux/iphone
        rm linux-arm64e-clang.tar.xz

    - name: Build Package
      run: |
        export THEOS=/opt/theos
        export THEOS_MAKEFILE_PATH=/opt/theos/makefiles
        make clean package THEOS=/opt/theos THEOS_PACKAGE_SCHEME=roothide
        
    - name: Upload .deb Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FaceID2D-deb
        path: packages/*.deb