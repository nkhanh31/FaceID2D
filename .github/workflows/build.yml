name: Build FaceID2D Tweak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install System Dependencies & Clang
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang llvm lld git perl wget unar

    - name: Setup Roothide Theos
      run: |
        git clone --recursive https://github.com/roothide/theos.git /opt/theos

    - name: Setup iOS SDK
      run: |
        rm -rf /opt/theos/sdks
        git clone --depth 1 https://github.com/theos/sdks.git /opt/theos/sdks

    - name: Link System Clang to Theos Toolchain
      run: |
        mkdir -p /opt/theos/toolchain/linux/iphone/bin
        ln -s $(which clang) /opt/theos/toolchain/linux/iphone/bin/clang
        ln -s $(which clang++) /opt/theos/toolchain/linux/iphone/bin/clang++
        ln -s $(which ld.lld) /opt/theos/toolchain/linux/iphone/bin/ld

    - name: Build Package
      run: |
        export THEOS=/opt/theos
        export THEOS_MAKEFILE_PATH=/opt/theos/makefiles
        make clean package THEOS=/opt/theos THEOS_PACKAGE_SCHEME=roothide
        
    - name: Upload .deb Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FaceID2D-deb
        path: packages/*.deb