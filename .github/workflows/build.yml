name: Build FaceID2D Tweak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang llvm lld git perl wget unar curl

    - name: Setup Roothide Theos
      run: |
        git clone --recursive https://github.com/roothide/theos.git /opt/theos

    - name: Setup iOS SDK
      run: |
        rm -rf /opt/theos/sdks
        git clone --depth 1 https://github.com/theos/sdks.git /opt/theos/sdks

    - name: Setup Complete Linux Toolchain & ldid
      run: |
        mkdir -p /opt/theos/toolchain/linux/iphone/bin
        mkdir -p /opt/theos/bin
        
        # Link to system clang/lld
        ln -sf $(which clang) /opt/theos/toolchain/linux/iphone/bin/clang
        ln -sf $(which clang++) /opt/theos/toolchain/linux/iphone/bin/clang++
        ln -sf $(which ld.lld) /opt/theos/toolchain/linux/iphone/bin/ld
        
        # Fallback/Direct symlinks for lipo & strip
        LIPO_BIN=$(which llvm-lipo-18 || which llvm-lipo-17 || which llvm-lipo-16 || which llvm-lipo || echo "/usr/bin/llvm-lipo")
        STRIP_BIN=$(which llvm-strip-18 || which llvm-strip-17 || which llvm-strip-16 || which llvm-strip || echo "/usr/bin/llvm-strip")
        
        ln -sf $LIPO_BIN /opt/theos/toolchain/linux/iphone/bin/lipo
        ln -sf $STRIP_BIN /opt/theos/toolchain/linux/iphone/bin/strip
        
        # Setup ldid
        curl -LO https://raw.githubusercontent.com/roothide/theos/master/bin/ldid
        chmod +x ldid
        mv ldid /opt/theos/bin/

    - name: Build Package
      run: |
        export THEOS=/opt/theos
        export THEOS_MAKEFILE_PATH=/opt/theos/makefiles
        make clean package THEOS=/opt/theos THEOS_PACKAGE_SCHEME=roothide
        
    - name: Upload .deb Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FaceID2D-deb
        path: packages/*.deb