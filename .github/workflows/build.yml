name: Build FaceID2D Tweak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Setup Theos
      uses: howett/github-action-setup-theos@v1

    - name: Build Package
      run: |
        export THEOS=$THEOS
        make clean package THEOS_PACKAGE_SCHEME=roothide

    - name: Upload .deb Artifact
      uses: actions/upload-artifact@v3
      with:
        name: FaceID2D-deb
        path: packages/*.deb
