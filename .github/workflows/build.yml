name: Build FaceID2D Tweak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Dependencies & Roothide Theos
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang git perl
        git clone --recursive https://github.com/roothide/theos.git /opt/theos

    - name: Build Package
      run: |
        export THEOS=/opt/theos
        export THEOS_MAKEFILE_PATH=/opt/theos/makefiles
        make clean package THEOS=/opt/theos THEOS_PACKAGE_SCHEME=roothide

    - name: Upload .deb Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FaceID2D-deb
        path: packages/*.deb
